<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#071018" />
  <meta name="description" content="Kick District: a fast, skill-based pixel football game from Calynx Studio. Own the curve, win five cups, and build your matchday identity." />
  <meta property="og:title" content="Kick District" />
  <meta property="og:description" content="Bend the ball, beat the wall, become a pixel football legend." />
  <meta property="og:type" content="website" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Kick District — Own the Curve</title>
  <!-- CrazyGames SDK v3: disabled automatically away from supported/local environments. -->
  <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%23071018'/%3E%3Crect x='4' y='2' width='8' height='2' fill='%23f3e7c3'/%3E%3Crect x='2' y='4' width='12' height='8' fill='%23f3e7c3'/%3E%3Crect x='4' y='12' width='8' height='2' fill='%23a8b0ae'/%3E%3Crect x='6' y='5' width='4' height='2' fill='%23071018'/%3E%3Crect x='4' y='8' width='2' height='2' fill='%23071018'/%3E%3Crect x='10' y='8' width='2' height='2' fill='%23071018'/%3E%3C/svg%3E" />
  <style>
    :root {
      color-scheme: dark;
      --ink: #071018;
      --night: #0b1624;
      --panel: #13263a;
      --panel-hi: #213a52;
      --cream: #f3e7c3;
      --gold: #f3c449;
      --grass: #185b38;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      overflow: hidden;
      background: var(--ink);
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      overscroll-behavior: none;
    }

    body {
      position: fixed;
      inset: 0;
      font-family: "Pixelify Sans", "Courier New", monospace;
      background:
        radial-gradient(circle at 50% 18%, rgba(63, 116, 148, 0.22), transparent 35%),
        linear-gradient(180deg, #102337 0 48%, #071018 48% 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.16;
      background-image:
        repeating-linear-gradient(0deg, transparent 0 3px, rgba(255,255,255,0.04) 3px 4px),
        repeating-linear-gradient(90deg, transparent 0 11px, rgba(0,0,0,0.12) 11px 12px);
    }

    html.fkl-high-contrast {
      --cream: #fffbe9;
      --gold: #ffd84f;
      --panel: #0c2033;
      --panel-hi: #294b67;
    }

    html.fkl-high-contrast canvas {
      filter: contrast(1.18) saturate(1.08) brightness(1.04);
      outline-color: rgba(255, 216, 79, 0.9);
    }

    #app {
      position: fixed;
      inset: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
      display: flex;
      align-items: center;
      justify-content: center;
      isolation: isolate;
    }

    canvas {
      display: block;
      image-rendering: pixelated;
      outline: 2px solid rgba(154, 117, 64, 0.52);
      box-shadow: 0 12px 44px rgba(3, 9, 15, 0.78), 0 0 0 4px rgba(7, 16, 24, 0.82);
    }

    #loading,
    #rotate {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      padding: calc(20px + var(--safe-top)) calc(20px + var(--safe-right)) calc(20px + var(--safe-bottom)) calc(20px + var(--safe-left));
      color: var(--cream);
      background: var(--ink);
    }

    #settings-panel[hidden] { display: none; }

    #settings-panel {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: grid;
      place-items: center;
      overflow: auto;
      padding: calc(16px + var(--safe-top)) calc(16px + var(--safe-right)) calc(16px + var(--safe-bottom)) calc(16px + var(--safe-left));
      color: var(--cream);
      background: rgba(3, 9, 15, 0.84);
      font-family: "Pixelify Sans", "Courier New", monospace;
      opacity: 0;
      transition: opacity 120ms steps(2, end);
    }

    #settings-panel.is-open { opacity: 1; }

    .settings-card {
      width: min(92vw, 620px);
      max-height: calc(100dvh - 32px - var(--safe-top) - var(--safe-bottom));
      overflow: auto;
      padding: 18px;
      border: 3px solid #9a7540;
      outline: 2px solid var(--ink);
      background:
        linear-gradient(180deg, rgba(33, 58, 82, 0.94), rgba(19, 38, 58, 0.98)),
        var(--panel);
      box-shadow: 8px 8px 0 rgba(3, 9, 15, 0.82), inset 0 0 0 2px rgba(243, 196, 73, 0.16);
    }

    .settings-heading {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 14px;
    }

    /* Pixelify Sans is loaded at 400 only. Faux-bold closes the C aperture and
       turns every "C" into an "O", so DOM chrome must pin the real weight. */
    .settings-heading h2 {
      margin: 0;
      color: var(--gold);
      font-weight: 400;
      font-size: clamp(20px, 4vw, 30px);
      line-height: 1;
      letter-spacing: -0.035em;
      text-shadow: 3px 3px 0 var(--ink);
    }

    .settings-heading p {
      margin: 6px 0 0;
      color: #b9c6c5;
      font: 700 11px/1.35 "Courier New", monospace;
    }

    .settings-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .setting-row {
      min-width: 0;
      padding: 10px 11px;
      border: 2px solid #30465b;
      background: rgba(7, 16, 24, 0.76);
    }

    .setting-row > span:first-child,
    .setting-row > label:first-child {
      display: block;
      margin-bottom: 7px;
      color: var(--cream);
      font-size: 11px;
      letter-spacing: 0.025em;
    }

    .range-line {
      display: grid;
      grid-template-columns: 1fr 42px;
      align-items: center;
      gap: 9px;
    }

    .range-line output {
      color: var(--gold);
      font: 700 11px/1 "Courier New", monospace;
      text-align: right;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--gold);
    }

    .settings-select {
      width: 100%;
      min-height: 34px;
      padding: 5px 8px;
      border: 2px solid #667b88;
      border-radius: 0;
      color: var(--cream);
      background: var(--panel);
      font: 400 12px/1 "Pixelify Sans", "Courier New", monospace;
    }

    .setting-toggle {
      position: relative;
      display: flex;
      min-height: 34px;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
    }

    .setting-row > label.setting-toggle {
      display: flex;
      margin-bottom: 0;
    }

    .setting-toggle > span:first-child { margin: 0; }
    .setting-toggle input {
      position: absolute;
      z-index: 1;
      right: 0;
      width: 60px;
      height: 24px;
      margin: 0;
      opacity: 0;
      cursor: pointer;
    }

    .switch-track {
      position: relative;
      flex: 0 0 60px;
      height: 24px;
      border: 2px solid #8fa2ab;
      background: #0b1624;
      box-shadow: inset 2px 2px 0 var(--ink);
      pointer-events: none;
    }

    .switch-track::before {
      content: "OFF";
      position: absolute;
      right: 5px;
      top: 5px;
      color: #b9c6c5;
      font: 800 8px/1 "Courier New", monospace;
      letter-spacing: 0.04em;
    }

    .switch-track::after {
      content: "";
      position: absolute;
      left: 3px;
      top: 3px;
      width: 14px;
      height: 14px;
      background: #8fa2ab;
      transition: left 100ms steps(2, end), background 100ms;
    }

    .setting-toggle input:checked + .switch-track {
      border-color: var(--gold);
      background: #185b38;
    }

    .setting-toggle input:checked + .switch-track::before {
      content: "ON";
      left: 6px;
      right: auto;
      color: #fffbe9;
    }

    .setting-toggle input:checked + .switch-track::after {
      left: 39px;
      background: var(--gold);
    }

    .setting-toggle input:focus-visible + .switch-track,
    input[type="range"]:focus-visible,
    .settings-select:focus-visible,
    .settings-button:focus-visible {
      outline: 3px solid #66b7bf;
      outline-offset: 3px;
    }

    .settings-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 14px;
    }

    .settings-button {
      min-height: 38px;
      padding: 7px 16px;
      border: 2px solid #667b88;
      border-radius: 0;
      color: var(--cream);
      background: #213a52;
      box-shadow: 3px 3px 0 var(--ink);
      font: 800 11px/1 "Arial Black", "Trebuchet MS", sans-serif;
      cursor: pointer;
    }

    .settings-button:active {
      translate: 2px 2px;
      box-shadow: 1px 1px 0 var(--ink);
    }

    .settings-button.primary {
      border-color: #9a7540;
      color: #071018;
      background: var(--gold);
    }

    .sr-only {
      position: fixed;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    #loading {
      transition: opacity 180ms steps(3, end), visibility 180ms;
    }

    #loading.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .boot-card {
      width: min(82vw, 340px);
      text-align: center;
    }

    .boot-kicker {
      display: block;
      color: var(--gold);
      font-size: clamp(12px, 3.4vw, 18px);
      letter-spacing: 0.24em;
      text-transform: uppercase;
    }

    .boot-title {
      margin: 4px 0 15px;
      color: var(--cream);
      font-size: clamp(28px, 8vw, 48px);
      line-height: 0.88;
      letter-spacing: -0.06em;
      text-shadow: 4px 4px 0 #13263a;
    }

    .boot-meter {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 3px;
      height: 12px;
      padding: 3px;
      border: 2px solid #9a7540;
      background: #13263a;
    }

    .boot-meter span {
      background: var(--gold);
      animation: boot-pulse 1.1s steps(1, end) infinite;
      animation-delay: calc(var(--i) * 65ms);
    }

    .boot-note {
      margin-top: 10px;
      color: #8fa2ab;
      font: 700 10px/1.3 "Courier New", monospace;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    #rotate {
      display: none;
      background:
        linear-gradient(180deg, rgba(19, 38, 58, 0.96), rgba(7, 16, 24, 0.99)),
        var(--ink);
    }

    .rotate-card {
      max-width: 300px;
      text-align: center;
    }

    .phone-pixel {
      width: 42px;
      height: 68px;
      margin: 0 auto 24px;
      border: 5px solid var(--cream);
      box-shadow: 5px 5px 0 #9a7540;
      animation: rotate-phone 1.8s steps(6, end) infinite;
    }

    .rotate-card strong {
      display: block;
      color: var(--gold);
      font-weight: 400;
      font-size: 19px;
      line-height: 1.05;
      letter-spacing: 0.03em;
    }

    .rotate-card small {
      display: block;
      margin-top: 9px;
      color: #a8b0ae;
      font: 700 11px/1.4 "Courier New", monospace;
    }

    noscript {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--cream);
      background: var(--ink);
      text-align: center;
    }

    @keyframes boot-pulse {
      0%, 18% { opacity: 0.18; }
      19%, 100% { opacity: 1; }
    }

    @keyframes rotate-phone {
      0%, 35% { transform: rotate(0deg); }
      65%, 100% { transform: rotate(90deg); }
    }

    @media (orientation: portrait) and (max-width: 820px) {
      #rotate { display: grid; }
    }

    @media (orientation: landscape) and (max-height: 520px) {
      canvas { outline: 0; box-shadow: none; }
      .settings-card { padding: 11px 13px; }
      .settings-heading { margin-bottom: 8px; }
      .settings-heading h2 { font-size: 19px; }
      .settings-heading p { margin-top: 3px; font-size: 9px; }
      .settings-grid { gap: 7px; }
      .setting-row { padding: 6px 8px; }
      .setting-row > span:first-child,
      .setting-row > label:first-child { margin-bottom: 4px; font-size: 9px; }
      .setting-toggle { min-height: 25px; }
      .settings-actions { margin-top: 8px; }
      .settings-button { min-height: 30px; padding: 5px 12px; font-size: 9px; }
    }

    @media (max-width: 560px) {
      .settings-grid { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 1ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 1ms !important;
      }
    }

    html.fkl-reduced-motion *,
    html.fkl-reduced-motion *::before,
    html.fkl-reduced-motion *::after {
      animation-duration: 1ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 1ms !important;
      scroll-behavior: auto !important;
    }
  </style>
</head>
<body>
  <main id="app" aria-label="Kick District game by Calynx Studio"></main>

  <div id="loading" role="status" aria-live="polite">
    <div class="boot-card">
      <span class="boot-kicker">A Calynx Studio game</span>
      <div class="boot-title">KICK<br />DISTRICT</div>
      <div class="boot-meter" aria-hidden="true">
        <span style="--i:0"></span><span style="--i:1"></span><span style="--i:2"></span>
        <span style="--i:3"></span><span style="--i:4"></span><span style="--i:5"></span>
        <span style="--i:6"></span><span style="--i:7"></span><span style="--i:8"></span>
        <span style="--i:9"></span><span style="--i:10"></span><span style="--i:11"></span>
      </div>
      <div class="boot-note">Preparing the floodlights</div>
    </div>
  </div>

  <aside id="rotate" aria-label="Rotate device to landscape">
    <div class="rotate-card">
      <div class="phone-pixel" aria-hidden="true"></div>
      <strong>ROTATE FOR KICK-OFF</strong>
      <small>Kick District is built for landscape play.</small>
    </div>
  </aside>

  <section id="settings-panel" aria-label="Game settings" hidden>
    <div class="settings-card" role="dialog" aria-modal="true" aria-labelledby="settings-title" aria-describedby="settings-description">
      <div class="settings-heading">
        <div>
          <h2 id="settings-title">MATCH SETTINGS</h2>
          <p id="settings-description">Tune the game without resetting your career.</p>
        </div>
        <button class="settings-button primary" type="button" data-action="close">DONE</button>
      </div>

      <div class="settings-grid">
        <div class="setting-row">
          <label for="setting-music">MUSIC VOLUME</label>
          <div class="range-line">
            <input id="setting-music" type="range" min="0" max="1" step="0.05" data-setting="musicVolume" />
            <output data-output="musicVolume">30%</output>
          </div>
        </div>
        <div class="setting-row">
          <label for="setting-sfx">SFX VOLUME</label>
          <div class="range-line">
            <input id="setting-sfx" type="range" min="0" max="1" step="0.05" data-setting="sfxVolume" />
            <output data-output="sfxVolume">100%</output>
          </div>
        </div>
        <div class="setting-row">
          <label for="setting-aim">AIM ASSIST</label>
          <select id="setting-aim" class="settings-select" data-setting="aimAssist">
            <option value="full">FULL TRAJECTORY</option>
            <option value="reduced">SHORT GUIDE</option>
            <option value="off">METERS ONLY</option>
          </select>
        </div>
        <div class="setting-row">
          <label class="setting-toggle">
            <span>MUTE ALL AUDIO</span>
            <input type="checkbox" data-setting="muted" />
            <span class="switch-track" aria-hidden="true"></span>
          </label>
        </div>
        <div class="setting-row">
          <label class="setting-toggle">
            <span>REDUCED MOTION</span>
            <input type="checkbox" data-setting="reducedMotion" />
            <span class="switch-track" aria-hidden="true"></span>
          </label>
        </div>
        <div class="setting-row">
          <label class="setting-toggle">
            <span>SCREEN SHAKE</span>
            <input type="checkbox" data-setting="screenShake" />
            <span class="switch-track" aria-hidden="true"></span>
          </label>
        </div>
        <div class="setting-row">
          <label class="setting-toggle">
            <span>HIGH CONTRAST</span>
            <input type="checkbox" data-setting="highContrast" />
            <span class="switch-track" aria-hidden="true"></span>
          </label>
        </div>
      </div>

      <div class="settings-actions">
        <button class="settings-button" type="button" data-action="reset">RESET SETTINGS</button>
      </div>
    </div>
  </section>

  <div id="game-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

  <noscript>JavaScript is required to play Kick District.</noscript>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
